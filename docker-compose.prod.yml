# Production overlay: adds the Nginx TLS reverse proxy.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires the SSL cert/key pair next to this file (not in the repo).
services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./STAR_IT_KMITL_AC_TH_PACK.crt:/etc/nginx/ssl/server.crt
      - ./STAR_IT_KMITL_AC_TH.key:/etc/nginx/ssl/server.key
    depends_on:
      - app

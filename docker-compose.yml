services:
  app:
    build: .
    restart: always
    ports:
      # Keep 3000 exposed for debugging if needed, or remove to force use of Nginx
      - "3000:3000"
    volumes:
      - ./db_data:/app/server/db
      - ./STAR_IT_KMITL_AC_TH_PACK.crt:/usr/local/share/ca-certificates/STAR_IT_KMITL_AC_TH_PACK.crt:ro
    env_file:
      - .env
    environment:
      # These will override env_file if specified, or fallback to file
      - PORT=3000
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/STAR_IT_KMITL_AC_TH_PACK.crt

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./STAR_IT_KMITL_AC_TH_PACK.crt:/etc/nginx/ssl/server.crt
      - ./STAR_IT_KMITL_AC_TH.key:/etc/nginx/ssl/server.key
    depends_on:
      - app

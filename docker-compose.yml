services:
  app:
    build: .
    restart: always
    ports:
      # Keep 3000 exposed for debugging if needed, or remove to force use of Nginx
      - "3000:3000"
    volumes:
      - ./db_data:/app/server/db
    env_file:
      - .env
    environment:
      # These will override env_file if specified, or fallback to file
      - PORT=3000

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
